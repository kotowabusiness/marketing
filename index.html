<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas — Mercadeo Kotowa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap');
  :root {
    --verde:#00614D; --verde-lt:#E6F2EF; --verde-dk:#004d3d;
    --gold:#C9A84C; --gold-lt:#F5EDD6; --gold-mid:#E8D49A;
    --linen:#FAF7F2; --dark:#1A120A;
    --white:#FFFFFF; --gray1:#F0EDE8; --gray2:#DDD8D0; --gray3:#9C8E7E;
    --urgente:#C0392B; --urgente-lt:#FDEDEC;
    --warning:#E67E22; --warning-lt:#FEF5EC;
    --azul:#2471A3; --azul-lt:#EAF2FB;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Montserrat',sans-serif; background:var(--linen); color:var(--dark); min-height:100vh; }

  /* HEADER */
  header { background:var(--verde); border-bottom:3px solid var(--gold); padding:0 2rem; height:56px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .header-brand { font-family:'Libre Baskerville',serif; font-size:13px; color:var(--white); letter-spacing:2px; text-transform:uppercase; }
  .header-sub   { font-size:10px; color:rgba(255,255,255,0.6); font-weight:400; margin-top:2px; }
  .btn-new { background:var(--gold); color:var(--dark); border:none; padding:7px 18px; font-family:'Montserrat',sans-serif; font-size:12px; font-weight:700; cursor:pointer; border-radius:2px; transition:background 0.15s; }
  .btn-new:hover { background:#b8932e; }

  /* NAV TABS */
  .nav-tabs { background:var(--verde-dk); display:flex; }
  .nav-tab { padding:9px 22px; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:600; color:rgba(255,255,255,0.55); cursor:pointer; border:none; background:none; text-transform:uppercase; letter-spacing:0.8px; transition:all 0.15s; border-bottom:2px solid transparent; }
  .nav-tab.active { color:var(--white); border-bottom-color:var(--gold); background:rgba(255,255,255,0.07); }
  .nav-tab:hover:not(.active) { color:rgba(255,255,255,0.85); }

  .vista { display:none; }
  .vista.active { display:block; }

  /* FILTROS */
  .filters { padding:0.65rem 2rem 0.55rem; display:flex; gap:0.35rem; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--gray2); background:var(--white); }
  .filter-sep { width:1px; height:16px; background:var(--gray2); margin:0 0.25rem; }
  .filter-label { font-size:10px; color:var(--verde); font-weight:700; text-transform:uppercase; letter-spacing:0.8px; }
  .filter-btn { padding:3px 10px; border-radius:20px; border:1px solid var(--gray2); background:var(--white); font-family:'Montserrat',sans-serif; font-size:11px; font-weight:500; cursor:pointer; color:var(--dark); transition:all 0.15s; }
  .filter-btn.active { background:var(--verde); color:var(--white); border-color:var(--verde); }
  .filter-btn:hover:not(.active) { border-color:var(--verde); color:var(--verde); }

  /* CARGA */
  .carga-bar { background:var(--white); border-bottom:1px solid var(--gray2); padding:0.55rem 2rem; display:flex; gap:1.5rem; flex-wrap:wrap; align-items:center; }
  .carga-persona { display:flex; flex-direction:column; gap:3px; min-width:130px; }
  .carga-nombre { font-size:10px; font-weight:700; color:var(--verde); text-transform:uppercase; letter-spacing:0.5px; display:flex; justify-content:space-between; }
  .carga-horas { font-size:10px; color:var(--gray3); }
  .carga-track { height:4px; background:var(--gray2); border-radius:2px; overflow:hidden; }
  .carga-fill { height:100%; border-radius:2px; background:var(--verde); transition:width 0.3s; }
  .carga-fill.overload { background:var(--urgente); }
  .carga-fill.warning  { background:var(--warning); }

  .board-header { padding:0.7rem 2rem 0.25rem; }
  .counter { font-size:11.5px; color:var(--gray3); font-weight:500; }
  .counter strong { color:var(--dark); font-weight:700; }
  .counter .urg { color:var(--urgente); font-weight:700; }

  /* TABLERO */
  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; padding:0.25rem 2rem 2rem; }
  .column { background:var(--gray1); border-radius:5px; padding:0.7rem; display:flex; flex-direction:column; gap:0.5rem; min-height:380px; }
  .col-header { display:flex; align-items:center; justify-content:space-between; padding-bottom:0.5rem; border-bottom:2px solid var(--gray2); margin-bottom:0.1rem; }
  .col-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; }
  .col-count { font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; background:var(--gray2); color:var(--dark); min-width:20px; text-align:center; }
  .col-pendiente .col-header{border-color:var(--gray3);} .col-pendiente .col-title{color:var(--gray3);}
  .col-proceso   .col-header{border-color:var(--gold);}  .col-proceso   .col-title{color:var(--gold);}
  .col-revision  .col-header{border-color:var(--verde);} .col-revision  .col-title{color:var(--verde);}
  .col-aprobado  .col-header{border-color:var(--verde);} .col-aprobado  .col-title{color:var(--verde);}

  /* TARJETA */
  .task-card { background:var(--white); border-radius:4px; padding:0.7rem 0.75rem; border-left:3px solid var(--gray2); box-shadow:0 1px 2px rgba(26,18,10,0.05); transition:transform 0.1s,box-shadow 0.1s; }
  .task-card:hover { transform:translateY(-1px); box-shadow:0 3px 10px rgba(26,18,10,0.1); }
  .task-card.urgente{border-left-color:var(--urgente);}
  .task-card.normal {border-left-color:var(--gold);}
  .task-card.baja   {border-left-color:var(--verde);}
  .task-top { display:flex; justify-content:space-between; align-items:flex-start; gap:0.4rem; margin-bottom:0.35rem; }
  .task-title { font-size:12px; font-weight:600; line-height:1.35; color:var(--dark); flex:1; }
  .badge-prio { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; padding:2px 7px; border-radius:10px; white-space:nowrap; flex-shrink:0; }
  .badge-prio.urgente{background:var(--urgente-lt);color:var(--urgente);}
  .badge-prio.normal {background:var(--gold-lt);   color:var(--dark);}
  .badge-prio.baja   {background:var(--verde-lt);  color:var(--verde);}
  .task-meta { display:flex; gap:0.3rem; flex-wrap:wrap; margin-bottom:0.35rem; align-items:center; }
  .badge-tipo { font-size:9px; font-weight:600; padding:2px 7px; border-radius:2px; background:var(--gold-lt); color:var(--dark); text-transform:uppercase; letter-spacing:0.5px; border:1px solid var(--gold-mid); }
  .badge-resp { font-size:9px; font-weight:600; padding:2px 7px; border-radius:2px; background:var(--verde-lt); color:var(--verde); text-transform:uppercase; letter-spacing:0.5px; border:1px solid #b2d4cc; }
  .task-brief { font-size:11px; color:var(--gray3); line-height:1.45; margin-bottom:0.4rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .task-time { background:var(--linen); border-radius:3px; padding:0.35rem 0.5rem; margin-bottom:0.4rem; display:flex; justify-content:space-between; align-items:center; gap:0.4rem; }
  .task-time-est { font-size:10px; font-weight:600; color:var(--dark); }
  .task-time-est span { color:var(--verde); }
  .task-entrega { font-size:10px; font-weight:700; text-align:right; }
  .task-entrega small { display:block; font-size:9px; font-weight:500; color:var(--gray3); }
  .task-entrega.vencida{color:var(--urgente);} .task-entrega.hoy{color:var(--warning);} .task-entrega.ok{color:var(--verde);}
  .task-progress { margin-bottom:0.4rem; }
  .progress-track { height:4px; background:var(--gray2); border-radius:2px; overflow:hidden; }
  .progress-fill { height:100%; border-radius:2px; background:var(--verde); }
  .progress-fill.warn{background:var(--warning);} .progress-fill.over{background:var(--urgente);}
  .progress-label { font-size:9px; color:var(--gray3); margin-top:2px; }
  .task-footer { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem; }
  .task-date { font-size:10px; font-weight:600; color:var(--gray3); }
  .task-date.vencida{color:var(--urgente);} .task-date.hoy{color:var(--gold);}
  .timer { font-size:10px; font-weight:700; color:var(--gray3); background:var(--gray1); padding:2px 6px; border-radius:3px; font-variant-numeric:tabular-nums; }
  .timer.urgente-timer{color:var(--urgente);background:var(--urgente-lt);}
  .task-actions { display:flex; gap:0.25rem; padding-top:0.4rem; border-top:1px solid var(--gray1); }
  .btn-action { font-size:10px; font-weight:600; padding:4px 7px; border:1px solid var(--gray2); border-radius:2px; cursor:pointer; background:var(--white); color:var(--dark); font-family:'Montserrat',sans-serif; transition:all 0.12s; flex:1; text-align:center; }
  .btn-action:hover{background:var(--verde);color:var(--white);border-color:var(--verde);}
  .btn-action.avanzar{background:var(--verde-lt);color:var(--verde);border-color:var(--verde);font-weight:700;}
  .btn-action.avanzar:hover{background:var(--verde);color:var(--white);}
  .btn-action.done{background:var(--gold-lt);color:var(--dark);border-color:var(--gold-mid);cursor:default;}
  .btn-action.danger:hover{background:var(--urgente-lt);color:var(--urgente);border-color:var(--urgente);}
  .empty-col { text-align:center; padding:2rem 1rem; color:var(--gray3); font-size:11px; line-height:1.7; opacity:0.7; }

  /* ── REPORTES ── */
  .reporte-wrap { padding:1.5rem 2rem 2rem; }
  .reporte-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; flex-wrap:wrap; gap:0.75rem; }
  .reporte-titulo { font-family:'Libre Baskerville',serif; font-size:17px; color:var(--dark); }
  .periodo-btns { display:flex; gap:0.4rem; }
  .periodo-btn { padding:5px 14px; border-radius:20px; border:1px solid var(--gray2); background:var(--white); font-family:'Montserrat',sans-serif; font-size:11px; font-weight:600; cursor:pointer; color:var(--dark); transition:all 0.15s; }
  .periodo-btn.active{background:var(--verde);color:var(--white);border-color:var(--verde);}

  /* SCORE CARDS */
  .score-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:1.25rem; }
  .score-card { background:var(--white); border-radius:6px; padding:1.1rem 1.25rem; box-shadow:0 1px 3px rgba(26,18,10,0.07); border-top:3px solid var(--gray2); }
  .score-card.amy     { border-top-color:var(--verde); }
  .score-card.rafa    { border-top-color:var(--gold); }
  .score-card.carolina{ border-top-color:var(--azul); }
  .score-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.6rem; }
  .score-nombre { font-size:11px; font-weight:700; color:var(--verde); text-transform:uppercase; letter-spacing:0.8px; }
  .score-card.rafa .score-nombre    { color:var(--gold); }
  .score-card.carolina .score-nombre{ color:var(--azul); }
  .score-grade { font-size:36px; font-weight:700; font-family:'Libre Baskerville',serif; line-height:1; }
  .score-grade.A{color:var(--verde);}  .score-grade.B{color:var(--azul);}
  .score-grade.C{color:var(--warning);}  .score-grade.D,.score-grade.F{color:var(--urgente);}
  .score-pct { font-size:11px; color:var(--gray3); margin-top:2px; }
  .score-metrics { display:flex; flex-direction:column; gap:0.45rem; }
  .score-metric { display:flex; flex-direction:column; gap:3px; }
  .score-metric-row { display:flex; justify-content:space-between; font-size:11px; }
  .score-metric-label { color:var(--gray3); }
  .score-metric-val { font-weight:700; }
  .score-metric-val.good{color:var(--verde);}  .score-metric-val.warn{color:var(--warning);}  .score-metric-val.bad{color:var(--urgente);}
  .score-bar { height:4px; background:var(--gray2); border-radius:2px; overflow:hidden; }
  .score-bar-fill { height:100%; border-radius:2px; background:var(--verde); }
  .score-bar-fill.warn{background:var(--warning);} .score-bar-fill.bad{background:var(--urgente);}
  .score-footer { margin-top:0.7rem; padding-top:0.6rem; border-top:1px solid var(--gray1); font-size:10px; color:var(--gray3); }

  /* RESUMEN GENERAL */
  .resumen-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.75rem; margin-bottom:1.25rem; }
  .resumen-card { background:var(--white); border-radius:5px; padding:0.9rem 1rem; box-shadow:0 1px 3px rgba(26,18,10,0.07); text-align:center; }
  .resumen-num { font-size:26px; font-weight:700; font-family:'Libre Baskerville',serif; color:var(--dark); line-height:1; }
  .resumen-label { font-size:10px; color:var(--gray3); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }

  /* TABLA HISTORIAL */
  .r-section { background:var(--white); border-radius:6px; padding:1rem 1.25rem; box-shadow:0 1px 3px rgba(26,18,10,0.07); margin-bottom:1rem; }
  .r-section-title { font-size:11px; font-weight:700; color:var(--verde); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:0.8rem; padding-bottom:0.5rem; border-bottom:1px solid var(--gray2); }
  table.r-table { width:100%; border-collapse:collapse; font-size:11.5px; }
  table.r-table th { text-align:left; font-size:10px; font-weight:700; color:var(--gray3); text-transform:uppercase; letter-spacing:0.5px; padding:0 0.5rem 0.5rem; border-bottom:1px solid var(--gray2); }
  table.r-table td { padding:0.4rem 0.5rem; border-bottom:1px solid var(--gray1); vertical-align:middle; color:var(--dark); }
  table.r-table tr:last-child td { border-bottom:none; }
  .r-badge { font-size:9px; font-weight:700; padding:2px 8px; border-radius:10px; text-transform:uppercase; white-space:nowrap; }
  .r-badge.ok     { background:var(--verde-lt);   color:var(--verde); }
  .r-badge.tarde  { background:var(--urgente-lt); color:var(--urgente); }
  .r-badge.puntual{ background:var(--gold-lt);    color:var(--dark); }
  .r-badge.proceso{ background:var(--azul-lt);    color:var(--azul); }
  .r-empty { text-align:center; padding:3rem 1rem; color:var(--gray3); font-size:12px; line-height:1.8; }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(26,18,10,0.6); z-index:200; align-items:center; justify-content:center; padding:1rem; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--white); border-radius:6px; width:100%; max-width:540px; max-height:92vh; overflow-y:auto; box-shadow:0 24px 64px rgba(26,18,10,0.28); }
  .modal-header { background:var(--verde); padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; border-radius:6px 6px 0 0; border-bottom:2px solid var(--gold); }
  .modal-title { font-family:'Libre Baskerville',serif; font-size:15px; color:var(--white); }
  .modal-close { background:none; border:none; color:rgba(255,255,255,0.6); cursor:pointer; font-size:22px; line-height:1; transition:color 0.1s; }
  .modal-close:hover { color:var(--white); }
  .modal-body { padding:1.4rem; background:var(--linen); display:flex; flex-direction:column; gap:0.85rem; }
  .form-group { display:flex; flex-direction:column; gap:0.3rem; }
  .form-label { font-size:10px; font-weight:700; color:var(--verde); text-transform:uppercase; letter-spacing:0.8px; }
  .form-input,.form-select,.form-textarea { font-family:'Montserrat',sans-serif; font-size:13px; padding:8px 11px; border:1.5px solid var(--gray2); border-radius:3px; color:var(--dark); background:var(--white); transition:border-color 0.15s; outline:none; }
  .form-input:focus,.form-select:focus,.form-textarea:focus { border-color:var(--verde); }
  .form-textarea { resize:vertical; min-height:75px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; }
  .ia-box { background:var(--verde-lt); border:1px solid #b2d4cc; border-radius:4px; padding:0.6rem 0.75rem; display:flex; align-items:center; gap:0.55rem; }
  .ia-icon { font-size:15px; flex-shrink:0; }
  .ia-text { font-size:11px; color:var(--dark); flex:1; line-height:1.45; }
  .ia-text strong { color:var(--verde); }
  .ia-loading { animation:pulse 1.2s ease-in-out infinite; color:var(--gray3); font-size:11px; }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .horas-wrap { display:flex; align-items:center; gap:0.5rem; }
  .horas-wrap .form-input { width:85px; text-align:center; font-weight:700; font-size:15px; }
  .horas-hint { font-size:11px; color:var(--gray3); flex:1; line-height:1.4; }
  .entrega-box { background:var(--white); border:1.5px solid var(--verde); border-radius:4px; padding:0.6rem 0.75rem; display:flex; align-items:center; justify-content:space-between; gap:0.5rem; }
  .entrega-label { font-size:10px; color:var(--verde); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
  .entrega-valor { font-size:14px; font-weight:700; color:var(--dark); }
  .entrega-detalle { font-size:10px; color:var(--gray3); margin-top:1px; }
  .modal-footer { padding:0.7rem 1.4rem 1.4rem; background:var(--linen); display:flex; gap:0.5rem; justify-content:flex-end; border-radius:0 0 6px 6px; }
  .btn-cancel { padding:7px 16px; border:1.5px solid var(--gray2); background:var(--white); border-radius:3px; font-family:'Montserrat',sans-serif; font-size:12px; font-weight:600; color:var(--gray3); cursor:pointer; transition:all 0.12s; }
  .btn-cancel:hover{border-color:var(--verde);color:var(--verde);}
  .btn-save { padding:7px 22px; background:var(--verde); border:none; border-radius:3px; font-family:'Montserrat',sans-serif; font-size:12px; font-weight:700; color:var(--white); cursor:pointer; transition:background 0.12s; }
  .btn-save:hover{background:var(--verde-dk);}

  .toast { position:fixed; bottom:1.5rem; right:1.5rem; background:var(--verde); color:var(--white); padding:9px 16px; border-radius:3px; border-left:3px solid var(--gold); font-size:12px; font-weight:500; z-index:300; opacity:0; transform:translateY(6px); transition:all 0.2s; pointer-events:none; max-width:300px; }
  .toast.show{opacity:1;transform:translateY(0);}

  @media(max-width:900px){.board{grid-template-columns:repeat(2,1fr);}.score-grid,.resumen-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.board{grid-template-columns:1fr;padding:0.5rem 1rem 2rem;}.filters,.board-header,.carga-bar,.reporte-wrap{padding-left:1rem;padding-right:1rem;}header{padding:0 1rem;}.score-grid{grid-template-columns:1fr;}}

  /* ── TOGGLE MODO ── */
  .modo-toggle { display:flex; gap:0; background:rgba(0,0,0,0.25); border-radius:3px; padding:2px; }
  .modo-btn { padding:5px 14px; font-family:'Montserrat',sans-serif; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; border:none; background:none; color:rgba(255,255,255,0.5); cursor:pointer; border-radius:2px; transition:all 0.15s; }
  .modo-btn.active { background:var(--gold); color:var(--dark); }
  .modo-btn:hover:not(.active) { color:var(--white); }

  /* ── KDS ── */
  #kds-wrap { display:none; background:var(--linen); min-height:calc(100vh - 115px); padding:0.75rem 1.5rem 1.5rem; }

  .kds-topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:2px solid var(--gold); }
  .kds-clock { font-family:'Libre Baskerville',serif; font-size:26px; color:var(--dark); font-variant-numeric:tabular-nums; letter-spacing:1px; }
  .kds-date { font-size:11px; color:var(--gray3); margin-top:2px; }
  .kds-stats { display:flex; gap:1.5rem; }
  .kds-stat { text-align:center; }
  .kds-stat-num { font-size:22px; font-weight:700; font-family:'Libre Baskerville',serif; line-height:1; color:var(--dark); }
  .kds-stat-lbl { font-size:9px; text-transform:uppercase; letter-spacing:0.8px; color:var(--gray3); margin-top:2px; }
  .kds-stat-num.urg { color:var(--urgente); }
  .kds-stat-num.ok  { color:var(--verde); }
  .kds-stat-num.mid { color:var(--gold); }

  /* Grid de tarjetas sueltas */
  .kds-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; }

  /* TARJETA KDS */
  .kds-card { background:var(--white); border-radius:6px; padding:1rem 1.1rem 0.9rem 1.3rem; position:relative; overflow:hidden; box-shadow:0 2px 8px rgba(26,18,10,0.08); transition:transform 0.1s, box-shadow 0.1s; border:1px solid var(--gray2); }
  .kds-card:hover { transform:translateY(-2px); box-shadow:0 5px 16px rgba(26,18,10,0.13); }
  .kds-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; border-radius:6px 0 0 6px; }
  .kds-card.urgente { border-color:rgba(192,57,43,0.3); }

  .kds-card.normal::before  { background:var(--gold); }

  .kds-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem; margin-bottom:0.4rem; }
  .kds-card-title { font-size:14px; font-weight:700; color:var(--dark); line-height:1.3; flex:1; }
  .kds-prio { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; padding:3px 9px; border-radius:10px; flex-shrink:0; }
  .kds-prio.urgente { background:var(--urgente); color:var(--white); animation:kds-blink 1.5s step-end infinite; }

  .kds-prio.baja    { background:var(--verde-lt); color:var(--verde); }
  @keyframes kds-blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .kds-meta { display:flex; gap:0.35rem; flex-wrap:wrap; margin-bottom:0.6rem; align-items:center; }
  .kds-badge { font-size:9px; font-weight:600; padding:2px 7px; border-radius:2px; text-transform:uppercase; letter-spacing:0.4px; }
  .kds-badge.resp { background:var(--verde-lt); color:var(--verde); border:1px solid #b2d4cc; }
  .kds-badge.tipo { background:var(--gold-lt); color:var(--dark); border:1px solid var(--gold-mid); }
  .kds-badge.estado-pendiente { background:var(--gray1); color:var(--gray3); border:1px solid var(--gray2); }
  .kds-badge.estado-proceso   { background:var(--gold-lt); color:var(--dark); border:1px solid var(--gold-mid); }
  .kds-badge.estado-revision  { background:var(--verde-lt); color:var(--verde); border:1px solid #b2d4cc; }

  /* Timer grande */
  .kds-timer-block { background:var(--linen); border-radius:4px; padding:0.5rem 0.65rem; margin-bottom:0.5rem; }
  .kds-big-timer { font-size:28px; font-weight:700; font-family:'Libre Baskerville',serif; font-variant-numeric:tabular-nums; letter-spacing:2px; line-height:1; }
  .kds-big-timer.ok   { color:var(--verde); }
  .kds-big-timer.warn { color:var(--gold); }
  .kds-big-timer.over { color:var(--urgente); }
  .kds-timer-sub { font-size:9px; color:var(--gray3); margin-top:2px; text-transform:uppercase; letter-spacing:0.5px; }

  /* Barra progreso */

  .kds-btn:hover { background:var(--dark); color:var(--gold); border-color:var(--dark); }

<script>
const SK = 'kotowa_tareas_v4';
let tareas=[], editandoId=null, estimateTimer=null, periodoActivo='semana', modoActual='kanban';
let filtros = {prioridad:[], responsable:[], fecha:[], tipo:[]};
let kdsResp = 'all';

const ESTADOS=['pendiente','proceso','revision','aprobado'];
const EL={pendiente:'Pendiente',proceso:'En proceso',revision:'En revisión',aprobado:'Aprobado'};
const EN={pendiente:'proceso',proceso:'revision',revision:'aprobado',aprobado:null};
const TL={diseno:'Diseño',presentacion:'Presentación',redes:'Redes',otro:'Otro'};
const RL={amy:'Amy',carolina:'Carolina',rafa:'Rafa'};
const HORARIO={1:9,2:9,3:9,4:9,5:9,6:4,0:0};
const H_INICIO=8;

async function cargar(){try{const r=await window.storage.get(SK,true);tareas=r?JSON.parse(r.value):[];}catch{tareas=[];}render();}
async function guardar(){try{await window.storage.set(SK,JSON.stringify(tareas),true);}catch(e){}}

// ── VISTA ─────────────────────────────────────────────────────────────────
function setVista(v,btn){
  document.querySelectorAll('.vista').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  document.getElementById(`vista-${v}`).classList.add('active');
  btn.classList.add('active');
  document.getElementById('btn-new-tarea').style.display = v==='tareas'?'':'none';
  document.getElementById('modo-toggle').style.display = v==='tareas'?'flex':'none';
  if(v==='reportes') renderReporte();
  if(v==='tareas') { if(modoActual==='kds') renderKDS(); else render(); }
}

// ── COLA Y ENTREGA ────────────────────────────────────────────────────────
function avanzarHoras(desde,horas){
  if(horas<=0) return new Date(desde);
  let dt=new Date(desde),rest=horas;
  while(rest>0){
    const dia=dt.getDay(),hDia=HORARIO[dia];
    if(!hDia){dt.setDate(dt.getDate()+1);dt.setHours(H_INICIO,0,0,0);continue;}
    const hFin=H_INICIO+hDia;
    const hAct=dt.getHours()+dt.getMinutes()/60;
    if(hAct>=hFin){dt.setDate(dt.getDate()+1);dt.setHours(H_INICIO,0,0,0);continue;}
    if(hAct<H_INICIO) dt.setHours(H_INICIO,0,0,0);
    const disp=hFin-Math.max(hAct,H_INICIO);
    if(rest<=disp){const hf=Math.max(hAct,H_INICIO)+rest;dt.setHours(Math.floor(hf),Math.round((hf%1)*60),0,0);rest=0;}
    else{rest-=disp;dt.setDate(dt.getDate()+1);dt.setHours(H_INICIO,0,0,0);}
  }
  return dt;
}

function calcEntrega(resp,horas,prio,excluir=null){
  const cola=tareas.filter(t=>t.responsable===resp&&(t.estado==='pendiente'||t.estado==='proceso')&&t.id!==excluir&&t.horas).sort((a,b)=>({urgente:0,normal:1,baja:2})[a.prioridad]-({urgente:0,normal:1,baja:2})[b.prioridad]);
  const horasAntes=prio==='urgente'?0:cola.reduce((s,t)=>s+(t.horas||0),0);
  const base=avanzarHoras(new Date(),horasAntes);
  const entrega=avanzarHoras(base,horas);
  return{entrega,horasCola:cola.reduce((s,t)=>s+(t.horas||0),0),numTareas:cola.length};
}

function fmtEntrega(dt){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const man=new Date(hoy);man.setDate(hoy.getDate()+1);
  const d=new Date(dt);d.setHours(0,0,0,0);
  const hr=dt.toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit'});
  if(d.getTime()===hoy.getTime()) return{label:`Hoy ${hr}`,cls:'hoy'};
  if(d.getTime()===man.getTime()) return{label:`Mañana ${hr}`,cls:'ok'};
  return{label:`${dt.toLocaleDateString('es-PA',{weekday:'short',day:'numeric',month:'short'})} ${hr}`,cls:'ok'};
}

// ── IA ESTIMACIÓN ─────────────────────────────────────────────────────────
function scheduleEstimate(){
  clearTimeout(estimateTimer);
  const t=document.getElementById('f-titulo').value.trim();
  if(!t)return;
  document.getElementById('ia-box').style.display='flex';
  document.getElementById('ia-text').innerHTML='<span class="ia-loading">Analizando...</span>';
  document.getElementById('horas-group').style.display='none';
  document.getElementById('entrega-box').style.display='none';
  estimateTimer=setTimeout(estimarIA,900);
}

async function estimarIA(){
  const titulo=document.getElementById('f-titulo').value.trim();
  const tipo=document.getElementById('f-tipo').value;
  const brief=document.getElementById('f-brief').value.trim();
  if(!titulo)return;
  const prompt=`Eres el asistente de planificación del equipo de Mercadeo de Kotowa Coffee House.
Analiza esta tarea y estima las horas de trabajo realistas.
Título: ${titulo}
Tipo: ${tipo}
Brief: ${brief||'(sin brief)'}
Contexto:
- Diseño (Amy): artes Illustrator/Photoshop/PPT, planogramas, foto producto
- Presentación: Word/PPT para junta, propuestas formales
- Redes: copy posts, calendarios, briefs
- Otro: operativo, coordinación
Responde SOLO JSON sin markdown: {"horas":número,"razon":"máx 12 palabras en español","complejidad":"baja|media|alta"}
Rangos: simple 0.5-1h, media 2-4h, compleja 6-12h. Máx 16h.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:150,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    const parsed=JSON.parse(data.content[0].text.replace(/```json|```/g,'').trim());
    const h=Math.max(0.5,Math.min(16,parseFloat(parsed.horas)||2));
    document.getElementById('ia-text').innerHTML=`<strong>Estimación: ${h}h</strong> — ${parsed.razon||''}`;
    document.getElementById('f-horas').value=h;
    document.getElementById('horas-hint').textContent=parsed.razon||'';
    document.getElementById('horas-group').style.display='block';
    recalcEntrega();
  }catch(e){
    const def={diseno:3,presentacion:4,redes:1.5,otro:2};
    const h=def[document.getElementById('f-tipo').value]||2;
    document.getElementById('ia-text').innerHTML=`<strong>Estimación base: ${h}h</strong> — por tipo de tarea`;
    document.getElementById('f-horas').value=h;
    document.getElementById('horas-group').style.display='block';
    recalcEntrega();
  }
}

function recalcEntrega(){
  const h=parseFloat(document.getElementById('f-horas')?.value)||0;
  if(!h)return;
  const resp=document.getElementById('f-responsable').value;
  const prio=document.getElementById('f-prioridad').value;
  const{entrega,horasCola,numTareas}=calcEntrega(resp,h,prio,editandoId);
  const fmt=fmtEntrega(entrega);
  document.getElementById('entrega-valor').textContent=fmt.label;
  document.getElementById('entrega-valor').className=`entrega-valor ${fmt.cls}`;
  document.getElementById('entrega-box').style.display='flex';
  document.getElementById('entrega-detalle').textContent=prio==='urgente'?'Entra primero en la cola':`Después de ${numTareas} tarea${numTareas>1?'s':''} en cola`;
  document.getElementById('cola-info').textContent=numTareas>0?`${horasCola}h comprometidas`:'Cola libre';
}

// ── RENDER TABLERO ────────────────────────────────────────────────────────
function filtradas(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const lun=new Date(hoy);lun.setDate(hoy.getDate()-(hoy.getDay()===0?6:hoy.getDay()-1));
  const dom=new Date(lun);dom.setDate(lun.getDate()+6);
  const iM=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const fM=new Date(hoy.getFullYear(),hoy.getMonth()+1,0);

  return tareas.filter(t=>{
    // Prioridad: si hay filtros activos, debe cumplir al menos uno
    if(filtros.prioridad.length && !filtros.prioridad.includes(t.prioridad)) return false;
    // Responsable
    if(filtros.responsable.length && !filtros.responsable.includes(t.responsable)) return false;
    // Tipo
    if(filtros.tipo.length && !filtros.tipo.includes(t.tipo)) return false;
    // Fecha: si hay filtros de fecha, debe cumplir al menos uno
    if(filtros.fecha.length){
      const d = t.fecha ? new Date(t.fecha+'T00:00:00') : null;
      const ok = filtros.fecha.some(f=>{
        if(f==='vencidas') return d && d < hoy;
        if(f==='hoy')      return d && d.getTime()===hoy.getTime();
        if(f==='semana')   return d && d>=lun && d<=dom;
        if(f==='mes')      return d && d>=iM && d<=fM;
        return false;
      });
      if(!ok) return false;
    }
    return true;
  });
}

    let pHtml='';

      pHtml=`<div class="task-progress"><div class="progress-track"><div class="progress-fill ${cls}" style="width:${pct}%"></div></div><div class="progress-label">${tr.toFixed(1)}h de ${t.horas}h (${pct}%)</div></div>`;}
    tHtml=`<div class="task-time"><div class="task-time-est">⏱ <span>${t.horas}h</span></div><div class="task-entrega ${fmt.cls}"><small>Entrega est.</small>${fmt.label}</div></div>${pHtml}`;}

function getPeriodoRango(){
  const hoy=new Date();hoy.setHours(23,59,59,999);
  if(periodoActivo==='todo') return{desde:new Date(0),hasta:hoy};
  if(periodoActivo==='mes'){const ini=new Date(hoy.getFullYear(),hoy.getMonth(),1);return{desde:ini,hasta:hoy};}
  // semana
  const lun=new Date(hoy);lun.setHours(0,0,0,0);lun.setDate(hoy.getDate()-(hoy.getDay()===0?6:hoy.getDay()-1));
  return{desde:lun,hasta:hoy};
}

function calcScore(p){
  const{desde,hasta}=getPeriodoRango();
  // Tareas aprobadas en el periodo
  const aprobadas=tareas.filter(t=>t.responsable===p&&t.estado==='aprobado'&&t.aprobadoEn&&t.aprobadoEn>=desde.getTime()&&t.aprobadoEn<=hasta.getTime());
  if(!aprobadas.length) return null;

  // SCORE 1: Cumplimiento de fecha límite
  const conFecha=aprobadas.filter(t=>t.fecha);
  let pctFecha=100;
  if(conFecha.length){
    const aTiempo=conFecha.filter(t=>{
      const limite=new Date(t.fecha+'T23:59:59');
      return t.aprobadoEn<=limite.getTime();
    });
    pctFecha=Math.round(aTiempo.length/conFecha.length*100);
  }

  // SCORE 2: Precisión de estimación de horas
  const conHoras=aprobadas.filter(t=>t.horas&&t.inicioProcess&&t.aprobadoEn);
  let pctHoras=100,promedioDesv=0;
  if(conHoras.length){
    const desvs=conHoras.map(t=>{
      const reales=(t.aprobadoEn-t.inicioProcess)/3600000;
      const estimado=t.horas;
      return Math.abs(reales-estimado)/estimado;
    });
    promedioDesv=desvs.reduce((s,d)=>s+d,0)/desvs.length;
    pctHoras=Math.max(0,Math.round((1-Math.min(promedioDesv,1))*100));
  }

  // Score combinado (60% fecha, 40% horas)
  const score=Math.round(pctFecha*0.6+pctHoras*0.4);
  const grade=score>=90?'A':score>=75?'B':score>=60?'C':score>=40?'D':'F';

  return{score,grade,pctFecha,pctHoras,total:aprobadas.length,conFecha:conFecha.length,conHoras:conHoras.length,aprobadas};
}

function avanzar(id,e){
  e.stopPropagation();
  const t=tareas.find(x=>x.id===id);if(!t)return;
  const next=EN[t.estado];if(!next)return;
  if(next==='proceso'&&!t.inicioProcess)t.inicioProcess=Date.now();
  if(next==='aprobado')t.aprobadoEn=Date.now();
  t.estado=next;guardar();render();
  toast(`"${t.titulo}" → ${EL[next]}`);
}

function editarTarea(id,e){
  e&&e.stopPropagation();
  const t=tareas.find(x=>x.id===id);if(!t)return;
  editandoId=id;
  document.getElementById('modal-title').textContent='Editar tarea';
  document.getElementById('f-titulo').value=t.titulo;
  document.getElementById('f-prioridad').value=t.prioridad;
  document.getElementById('f-tipo').value=t.tipo;
  document.getElementById('f-responsable').value=t.responsable||'amy';
  document.getElementById('f-estado').value=t.estado;
  document.getElementById('f-fecha').value=t.fecha||'';
  document.getElementById('f-brief').value=t.brief||'';
  if(t.horas){
    document.getElementById('ia-box').style.display='flex';
    document.getElementById('ia-text').innerHTML=`<strong>Estimación guardada: ${t.horas}h</strong> — ajusta si cambió el alcance`;
    document.getElementById('f-horas').value=t.horas;
    document.getElementById('horas-group').style.display='block';
    recalcEntrega();
  } else {
    document.getElementById('ia-box').style.display='none';
    document.getElementById('horas-group').style.display='none';
    document.getElementById('entrega-box').style.display='none';
  }
  document.getElementById('modal').classList.add('open');
}

function eliminarTarea(id,e){
  e.stopPropagation();
  const t=tareas.find(x=>x.id===id);
  if(!confirm(`¿Eliminar "${t?.titulo}"?`))return;
  tareas=tareas.filter(x=>x.id!==id);guardar();render();toast('Tarea eliminada');

function cerrarModal(){document.getElementById('modal').classList.remove('open');clearTimeout(estimateTimer);editandoId=null;}

function guardarTarea(){
  const titulo=document.getElementById('f-titulo').value.trim();
  if(!titulo){document.getElementById('f-titulo').focus();return;}
  const nuevoEstado=document.getElementById('f-estado').value;
  const horas=parseFloat(document.getElementById('f-horas')?.value)||null;
  const datos={titulo,prioridad:document.getElementById('f-prioridad').value,tipo:document.getElementById('f-tipo').value,responsable:document.getElementById('f-responsable').value,estado:nuevoEstado,fecha:document.getElementById('f-fecha').value,brief:document.getElementById('f-brief').value.trim(),horas};
  if(editandoId){
    const idx=tareas.findIndex(t=>t.id===editandoId);
    if(idx>-1){
      if(nuevoEstado==='proceso'&&!tareas[idx].inicioProcess)datos.inicioProcess=Date.now();
      else datos.inicioProcess=tareas[idx].inicioProcess;
      if(nuevoEstado==='aprobado'&&!tareas[idx].aprobadoEn)datos.aprobadoEn=Date.now();
      else datos.aprobadoEn=tareas[idx].aprobadoEn;
      Object.assign(tareas[idx],datos);
    }
    toast('Tarea actualizada');
  } else {
    tareas.push({...datos,id:`t${Date.now()}`,creadaEn:Date.now(),inicioProcess:nuevoEstado==='proceso'?Date.now():null,aprobadoEn:nuevoEstado==='aprobado'?Date.now():null});
    toast('Tarea creada');
  }
  guardar();cerrarModal();render();
}

function setFilter(grupo, val, btn){
  if(val==='all'){
    filtros={prioridad:[],responsable:[],fecha:[],tipo:[]};
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('[data-val="all"]').classList.add('active');
  } else {
    const arr=filtros[grupo];
    const idx=arr.indexOf(val);
    if(idx>-1) arr.splice(idx,1); else arr.push(val);
    btn.classList.toggle('active', arr.includes(val));
    const hay=Object.values(filtros).some(a=>a.length>0);
    document.querySelector('[data-val="all"]').classList.toggle('active',!hay);
  }
  render();
}

init();

// ── MODO KDS / KANBAN ─────────────────────────────────────────────────────

function setModo(modo, btn) {
  modoActual = modo;
  document.querySelectorAll('.modo-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (modo === 'kds') {
    document.getElementById('kds-wrap').style.display = 'block';
    document.querySelector('.board').style.display = 'none';
    document.querySelector('.filters').style.display = 'none';
    document.querySelector('.carga-bar').style.display = 'none';
    document.querySelector('.board-header').style.display = 'none';
    renderKDS();
  } else {
    document.getElementById('kds-wrap').style.display = 'none';
    document.querySelector('.board').style.display = 'grid';
    document.querySelector('.filters').style.display = 'flex';
    document.querySelector('.carga-bar').style.display = 'flex';
    document.querySelector('.board-header').style.display = 'block';
    render();
  }
}

// Reloj KDS
function tickKDS() {
  const now = new Date();
  const el = document.getElementById('kds-clock');
  if (el) el.textContent = now.toLocaleTimeString('es-PA', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const del = document.getElementById('kds-date');
  if (del) del.textContent = now.toLocaleDateString('es-PA', {weekday:'long', day:'numeric', month:'long'});
}
setInterval(tickKDS, 1000);
tickKDS();

function renderKDS() {
  // Ordenar: urgente primero, luego por estado (proceso > pendiente > revision),
  // luego por fecha límite, luego por hora de creación
  const estadoOrd = {proceso:0, pendiente:1, revision:2};
  const prioOrd   = {urgente:0, normal:1, baja:2};
  const activas = tareas
    .filter(t => (t.estado === 'pendiente' || t.estado === 'proceso' || t.estado === 'revision') && (kdsResp==='all' || t.responsable===kdsResp))
    .sort((a,b) => {
      if (prioOrd[a.prioridad] !== prioOrd[b.prioridad]) return prioOrd[a.prioridad] - prioOrd[b.prioridad];
      if (estadoOrd[a.estado] !== estadoOrd[b.estado]) return estadoOrd[a.estado] - estadoOrd[b.estado];
      if (a.fecha && b.fecha) return new Date(a.fecha) - new Date(b.fecha);
      return (a.creadaEn||0) - (b.creadaEn||0);
    });

  document.getElementById('kds-n-urg').textContent   = activas.filter(t=>t.prioridad==='urgente').length;
  document.getElementById('kds-n-proc').textContent  = activas.filter(t=>t.estado==='proceso').length;
  document.getElementById('kds-n-rev').textContent   = activas.filter(t=>t.estado==='revision').length;
  document.getElementById('kds-n-total').textContent = activas.length;

  const grid = document.getElementById('kds-grid');
  grid.innerHTML = '';
  if (!activas.length) {
    grid.innerHTML = '<div class="kds-empty" style="grid-column:1/-1">Sin tareas activas. Todo listo. ✓</div>';
    return;
  }
  activas.forEach(t => grid.appendChild(crearKDSCard(t)));
}

function crearKDSCard(t) {
  const div = document.createElement('div');
  div.className = `kds-card ${t.prioridad}`;

  const next = EN[t.estado];
  const btnLbl = next ? `${EL[next]} →` : '✓ Listo';
  const btnColorCls = t.estado==='proceso' ? 'avanzar-kds gold' : 'avanzar-kds';
  const btnCls = next ? btnColorCls : '';

  // Timer del proceso
  let timerHtml = '';
  let progHtml  = '';
  if (t.estado === 'proceso' && t.inicioProcess && t.horas) {
    const transcH = (Date.now() - t.inicioProcess) / 3600000;
    const pct = Math.min(100, Math.round(transcH / t.horas * 100));
    const timerCls = pct > 90 ? 'over' : pct > 70 ? 'warn' : 'ok';
    timerHtml = `<div class="kds-timer-block">
      <div class="kds-big-timer ${timerCls}" data-kds-inicio="${t.inicioProcess}" data-kds-horas="${t.horas}">--:--:--</div>
      <div class="kds-timer-sub">Tiempo transcurrido</div>
    </div>`;
    progHtml = `<div class="kds-prog-track"><div class="kds-prog-fill ${timerCls}" style="width:${pct}%" data-kds-prog="${t.id}"></div></div>
    <div class="kds-prog-meta"><span>${transcH.toFixed(1)}h de ${t.horas}h</span><span>${pct}%</span></div>`;
  }

  // Entrega estimada
  let entregaHtml = '';
  if (t.horas) {
    const {entrega:eR} = calcEntrega(t.responsable||'amy', 0, t.prioridad, t.id);
    const eT = avanzarHoras(eR, t.horas);
    const fmt = fmtEntrega(eT);
    entregaHtml = `<div class="kds-entrega">Entrega est. <b>${fmt.label}</b></div>`;
  }

  const estadoBadgeCls = `estado-${t.estado}`;
  const estadoLbl = EL[t.estado];
  div.innerHTML = `
    <div class="kds-card-top">
      <div class="kds-card-title">${esc(t.titulo)}</div>
      <span class="kds-prio ${t.prioridad}">${t.prioridad}</span>
    </div>
    <div class="kds-meta">
      <span class="kds-badge resp">${RL[t.responsable]||'-'}</span>
      <span class="kds-badge tipo">${TL[t.tipo]||t.tipo}</span>
      <span class="kds-badge ${estadoBadgeCls}">${estadoLbl}</span>
    </div>
    ${timerHtml}
    ${progHtml}
    ${entregaHtml}
    <div class="kds-actions">
      <button class="kds-btn ${btnCls}" onclick="avanzarKDS('${t.id}',event)">${btnLbl}</button>
      <button class="kds-btn" onclick="editarTarea('${t.id}',event)">Editar</button>
    </div>`;
  return div;
}

function setKDSResp(resp, btn) {
  kdsResp = resp;
  document.querySelectorAll('[id^="kds-f-"]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderKDS();
}

function avanzarKDS(id, e) {
  e.stopPropagation();
  const t = tareas.find(x => x.id === id); if (!t) return;
  const next = EN[t.estado]; if (!next) return;
  if (next === 'proceso' && !t.inicioProcess) t.inicioProcess = Date.now();
  if (next === 'aprobado') t.aprobadoEn = Date.now();
  t.estado = next;
  guardar(); renderKDS(); render();
  toast(`"${t.titulo}" → ${EL[next]}`);
}

// Actualizar timers KDS cada segundo
setInterval(() => {
  if (modoActual !== 'kds') return;
  // Timers KDS
  document.querySelectorAll('.kds-big-timer[data-kds-inicio]').forEach(el => {
    const inicio = parseInt(el.dataset.kdsInicio);
    const horas  = parseFloat(el.dataset.kdsHoras);
    const diff   = (Date.now() - inicio) / 1000;
    const h = Math.floor(diff/3600), m = Math.floor((diff%3600)/60), s = Math.floor(diff%60);
    el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const pct = Math.min(100, (diff/3600) / horas * 100);
    el.className = `kds-big-timer ${pct>90?'over':pct>70?'warn':'ok'}`;
  });
  // Barras de progreso KDS
  document.querySelectorAll('.kds-prog-fill[data-kds-prog]').forEach(bar => {
    const t = tareas.find(x => x.id === bar.dataset.kdsProg);
    if (!t || !t.inicioProcess || !t.horas) return;
    const pct = Math.min(100, Math.round(((Date.now()-t.inicioProcess)/3600000)/t.horas*100));
    bar.style.width = pct+'%';
    bar.className = `kds-prog-fill ${pct>90?'over':pct>70?'warn':'ok'}`;
  });
}, 1000);

</script>
